# Enable the trigger after the initial authenticated Cloud Run deployment is verified.
steps:
  - name: node:24-bookworm
    entrypoint: sh
    env:
      - 'VITE_AUTH_BACKEND=firebase'
      - 'VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - 'VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
    args:
      - -ec
      - |
        test -f scripts/check-firebase-build-config.mjs
        node scripts/check-firebase-build-config.mjs
        ./scripts/fetch-ffmpeg.sh
        export PATH="$$PWD/.containers/ffmpeg:$$PATH"
        npm ci
        npm run typecheck
        npm test
        ./scripts/prepare-containers.sh
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--platform=linux/amd64', '-f', 'deploy/Dockerfile.web-api', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web-api:${BUILD_ID}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--platform=linux/amd64', '-f', 'deploy/Dockerfile.generator', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/generator:${BUILD_ID}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web-api:${BUILD_ID}']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/generator:${BUILD_ID}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -ec
      - |
        gcloud run services describe web-api --region=${_REGION} --project=${PROJECT_ID} >/dev/null
        gcloud run services describe generator --region=${_REGION} --project=${PROJECT_ID} >/dev/null
        gcloud run services update generator --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/generator:${BUILD_ID} --region=${_REGION} --project=${PROJECT_ID} --quiet
        gcloud run services update web-api --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web-api:${BUILD_ID} --region=${_REGION} --project=${PROJECT_ID} --quiet
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: t055
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
options:
  logging: CLOUD_LOGGING_ONLY
